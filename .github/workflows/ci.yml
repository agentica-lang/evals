name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Cache the pinned Agentica release and sources
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache
          key: agentica-${{ hashFiles('run.py') }}
      - name: Build the evaluation image
        run: docker build --tag agentica-eval:local .
      - name: Unit tests
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Reference solutions (no model calls)
        run: python3 run.py --check-references --jobs 4
